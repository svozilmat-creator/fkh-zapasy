<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FK Hlubočky — Docházka na zápasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E;
    --red-dark:#8E0C22;
    --red-tint:#FBE6E9;
    --white:#FFFFFF;
    --ink:#1A1A1A;
    --grey:#6E6E6E;
    --line:#E7E7E7;
    --paper:#FAFAFA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--white);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:17px;
    min-height:100vh;
    padding-bottom:60px;
  }
  .display{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.01em; }

  header.banner{
    background: var(--red);
    padding:30px 20px 26px;
    border-bottom:6px solid var(--red-dark);
  }
  .banner-inner{ max-width:720px; margin:0 auto; }
  h1.display{
    color:var(--white);
    font-size:clamp(32px, 8vw, 48px);
    margin:0 0 4px;
    line-height:1;
    font-weight:700;
  }
  .banner-sub{ color: var(--white); font-size:16px; opacity:0.92; }

  .who-bar{ max-width:720px; margin:0 auto; padding:18px 20px 0; }
  .who-card{
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .who-label{ font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:14px; letter-spacing:0.04em; color:var(--ink); font-weight:600; }
  select#whoami{
    flex:1; min-width:200px;
    font-family:'Work Sans', sans-serif;
    font-size:17px; font-weight:600;
    padding:10px 12px;
    border-radius:8px;
    border:2px solid var(--line);
    background:var(--white);
    color:var(--ink);
  }
  select#whoami:focus{ outline:2px solid var(--red); outline-offset:1px; }
  .storage-note{ font-size:13px; color:var(--grey); text-align:center; margin-top:10px; }

  .add-player-row{ text-align:center; margin-top:10px; }
  .add-player-btn{
    border:2px solid var(--red); background:var(--white); color:var(--red);
    font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px;
    font-weight:600; letter-spacing:0.03em; padding:8px 16px; border-radius:20px;
    cursor:pointer;
  }
  .add-player-btn:hover{ background:var(--red-tint); }
  .add-player-form{
    background:var(--paper); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .add-player-form input{
    font-family:'Work Sans', sans-serif; font-size:16px; padding:9px 12px;
    border-radius:8px; border:2px solid var(--line); background:var(--white); color:var(--ink);
  }
  .add-player-form input#new-player-name{ flex:1; min-width:180px; }
  .add-player-form input#new-player-num{ width:150px; }
  .add-player-form-actions{ display:flex; gap:8px; }

  main{ max-width:720px; margin:22px auto 0; padding:0 20px; }

  .card{
    background:var(--white);
    border:2px solid var(--line);
    border-radius:14px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:16px;
    cursor:pointer;
    user-select:none;
    padding:16px;
  }
  .kolo-badge{
    width:56px; height:56px;
    border-radius:50%;
    background: var(--red);
    color:var(--white);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:24px;
  }
  .match-info{ flex:1; min-width:0; }
  .teams{ font-family:'Oswald',sans-serif; font-size:21px; font-weight:600; color:var(--ink); line-height:1.25; }
  .teams .vs{ color:var(--grey); font-weight:400; margin:0 6px; font-size:17px; }
  .teams .us{ color:var(--red); }
  .meta-row{ display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .badge{
    font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.04em;
    padding:3px 10px; border-radius:20px; font-weight:600;
    background: var(--red-tint); color:var(--red-dark);
  }
  .date-text{ font-size:15px; color:var(--grey); font-weight:500; }
  .counts{ display:flex; gap:14px; margin-top:8px; font-size:14px; color:var(--grey); flex-wrap:wrap; font-weight:500;}
  .my-status-bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:0 16px 16px;
  }
  .my-status-label{
    font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px;
    letter-spacing:0.04em; font-weight:600; color:var(--grey); flex-shrink:0;
  }
  .my-status-prompt{
    font-size:14px; color:var(--grey); font-style:italic; padding-top:0;
  }
  .my-note-row{ padding:0 16px 16px; margin-top:-6px; }
  .my-note-row input{
    width:100%; font-family:'Work Sans', sans-serif; font-size:15px;
    padding:9px 12px; border-radius:8px; border:2px solid var(--line);
    background:var(--white); color:var(--ink);
  }
  .my-note-row input::placeholder{ color:#A6A6A6; }
  .my-note-row input:focus{ outline:2px solid var(--red); outline-offset:1px; border-color:var(--red); }

  .roster-toggle{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    border-top:2px solid var(--line);
    cursor:pointer;
    user-select:none;
    font-family:'Oswald',sans-serif; font-size:14px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.02em; color:var(--grey);
  }
  .roster-toggle:hover{ color:var(--ink); }
  .chevron{ color:var(--grey); font-size:20px; transition: transform 0.2s ease; flex-shrink:0; }
  .card.open .chevron{ transform:rotate(180deg); }

  .roster{
    max-height:0;
    overflow:hidden;
    transition: max-height 0.28s ease;
    background: var(--paper);
  }
  .card.open .roster{ max-height:2600px; }
  .roster-inner{ padding:6px 16px 12px; }
  .player-row{
    padding:11px 4px;
    border-bottom:1px solid var(--line);
  }
  .player-row:last-child{ border-bottom:none; }
  .player-row-main{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .player-name{ font-size:16px; font-weight:600; display:flex; align-items:center; gap:9px; min-width:160px; }
  .player-name .num{
    font-family:'Oswald',sans-serif; font-size:13px; color:var(--white);
    background:var(--ink); border-radius:5px; width:24px; height:24px;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .player-name.me{ color:var(--red-dark); }
  .player-name .me-tag{ font-size:11px; font-family:'Oswald',sans-serif; letter-spacing:0.04em; background:var(--red); color:var(--white); padding:2px 7px; border-radius:5px; text-transform:uppercase;}
  .player-note{ font-size:14px; font-weight:400; font-style:italic; color:var(--grey); }
  .player-note-row{ margin-top:6px; }
  .player-note-row:empty{ margin-top:0; }
  .own-note-input{
    width:100%; font-family:'Work Sans', sans-serif; font-size:14.5px; font-style:italic;
    padding:7px 10px; border-radius:7px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink);
  }
  .own-note-input::placeholder{ color:#A6A6A6; font-style:italic; }
  .own-note-input:focus{ outline:2px solid var(--red); outline-offset:1px; border-color:var(--red); background:var(--white); }

  .status-pill{
    font-family:'Oswald',sans-serif; font-size:12.5px; text-transform:uppercase;
    letter-spacing:0.03em; font-weight:600; padding:5px 12px; border-radius:20px;
    flex-shrink:0;
  }
  .status-pill.yes{ background:var(--red); color:var(--white); }
  .status-pill.no{ background:var(--ink); color:var(--white); }
  .status-pill.sun{ background:var(--red-tint); color:var(--red-dark); border:1.5px solid var(--red); }
  .status-pill.none{ background:var(--white); color:var(--grey); border:1.5px solid var(--line); }

  .status-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .status-btn{
    border:2px solid var(--line);
    background:var(--white);
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--ink);
    transition: all 0.15s ease;
  }
  .status-btn:hover{ border-color:var(--grey); }
  .status-btn:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
  .status-btn.active{ background:var(--red); border-color:var(--red); color:var(--white); }
  .status-btn.no.active{ background:var(--ink); border-color:var(--ink); }

  .foot{ text-align:center; color:var(--grey); font-size:13px; margin-top:36px; }

  @media (max-width:420px){
    .kolo-badge{ width:46px; height:46px; font-size:20px; }
    .teams{ font-size:19px; }
    .status-btn{ padding:8px 11px; font-size:13px; }
  }
</style>
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <h1 class="display">FK Hlubočky</h1>
    <div class="banner-sub">Docházka na zápasy — sezóna 2026/2027</div>
  </div>
</header>

<div class="who-bar">
  <div class="who-card">
    <span class="who-label">Jsem</span>
    <select id="whoami"></select>
    <button id="refresh-btn" title="Obnovit data" style="border:2px solid var(--line); background:var(--white); border-radius:8px; width:42px; height:42px; font-size:18px; cursor:pointer; flex-shrink:0;">⟳</button>
  </div>
  <div class="add-player-row">
    <button id="add-player-btn" class="add-player-btn">+ Přidat hráče</button>
  </div>
  <div id="add-player-form" class="add-player-form" style="display:none;">
    <input type="text" id="new-player-name" placeholder="Jméno a příjmení">
    <input type="number" id="new-player-num" placeholder="Číslo dresu (nepovinné)">
    <div class="add-player-form-actions">
      <button id="new-player-save" class="status-btn active">Přidat</button>
      <button id="new-player-cancel" class="status-btn">Zrušit</button>
    </div>
  </div>
  <div class="storage-note" id="sync-status">Načítám…</div>
</div>

<main id="matches"></main>

<div class="foot">Vyber si svoje jméno nahoře a u každého zápasu klikni, zda dorazíš.</div>

<script>
const PLAYERS = [
  {name:"Jiří Henkl", num:null},
  {name:"Tomáš Vydomus", num:null},
  {name:"Patrik Axmann", num:20},
  {name:"Karel Krätschmer", num:1},
  {name:"Ondřej Scigel", num:14},
  {name:"Jan Scigel", num:16},
  {name:"Pavel Jahoda", num:2},
  {name:"Marek Goldscheid", num:3},
  {name:"Martin Auffahrt", num:11},
  {name:"Matěj Svozil", num:10},
  {name:"František Henkl", num:7},
  {name:"Michael Korec", num:15},
  {name:"Tomáš Režný", num:13},
  {name:"Jiří Grauer", num:5},
  {name:"Jan Táborský", num:19},
  {name:"Tomáš Hloušek", num:4},
  {name:"Ondřej Goldscheid (C)", num:9},
  {name:"Radek Škapa", num:6},
  {name:"Bronislav Pudil", num:8},
];

const MATCHES = [
  {id:"f90a174d-48a6-40ff-824a-eee992859754", kolo:3, home:"FK Kozlovice \u201eB\u201c", away:"FK Hlubočky", day:"Neděle", date:"16. 8. 2026", time:"16:30"},
  {id:"aa1fb1a3-df09-47ba-bcc5-42d131d1653e", kolo:4, home:"FK Hlubočky", away:"Sokol Čechovice", day:"Sobota", date:"22. 8. 2026", time:"16:30"},
  {id:"6eff8211-76dc-4fba-a22b-0c49d58722f2", kolo:5, home:"FC Beňov", away:"FK Hlubočky", day:"Neděle", date:"30. 8. 2026", time:"16:00"},
  {id:"4875cc99-b5f3-4cd4-b458-504bb7cbe34d", kolo:6, home:"FK Hlubočky", away:"Haná Prostějov", day:"Sobota", date:"5. 9. 2026", time:"16:00"},
  {id:"ab232848-71fe-4975-9142-cc9cbac00ab8", kolo:7, home:"Sokol Ústí", away:"FK Hlubočky", day:"Neděle", date:"13. 9. 2026", time:"10:00"},
  {id:"4d2ff375-564e-4c51-86a7-069d07d2c67e", kolo:8, home:"FK Hlubočky", away:"FC Želatovice \u201eB\u201c", day:"Sobota", date:"19. 9. 2026", time:"10:00"},
  {id:"4bad5b62-2e22-4ffc-adeb-cc5c0c1258f6", kolo:9, home:"Sokol Určice", away:"FK Hlubočky", day:"Neděle", date:"27. 9. 2026", time:"15:30"},
  {id:"3d84d43b-08b6-433e-8357-1f7448197d9c", kolo:10, home:"TJ Kožušany", away:"FK Hlubočky", day:"Neděle", date:"4. 10. 2026", time:"15:00"},
  {id:"51c50c20-0957-4a15-bbba-5c5b3461638e", kolo:11, home:"FK Hlubočky", away:"Sokol Mostkovice", day:"Sobota", date:"10. 10. 2026", time:"15:00"},
  {id:"bec6f7eb-c69d-4eba-a08a-872be403707f", kolo:12, home:"MILO Olomouc-Nové Sady B", away:"FK Hlubočky", day:"Neděle", date:"18. 10. 2026", time:"10:00"},
  {id:"5a2c4d76-182c-4421-b1dd-f47e52673726", kolo:13, home:"FK Hlubočky", away:"SOKOL Opatovice", day:"Sobota", date:"24. 10. 2026", time:"14:30"},
  {id:"6b7843ed-6c2e-42f6-be0e-02eb37cb545b", kolo:2, home:"FK Hlubočky", away:"SK Radslavice", day:"Sobota", date:"31. 10. 2026", time:"14:00"},
  {id:"fe87c722-1000-49a1-907b-b0cd57bc3617", kolo:1, home:"Sokol Velký Týnec", away:"FK Hlubočky", day:"Neděle", date:"8. 11. 2026", time:"14:00"},
];

const STORAGE_PREFIX = 'hlubocky-dochazka:';

// ====== NASTAVENÍ SDÍLENÉHO ÚLOŽIŠTĚ (JSONBin.io) ======
// 1) Zaregistruj se zdarma na https://jsonbin.io
// 2) Vytvoř nový Bin s obsahem {}
// 3) Sem vlep Bin ID (z URL binu) a X-Master-Key (Account -> API Keys)
const JSONBIN_CONFIG = {
  binId: '6a609f84da38895dfe7ee216',
  apiKey: '$2a$10$XY4yIk0q5CokbrKCEAVnrucirwa8Kp87eaa/DI.1uh4fgGiO2iQEu'
};
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_CONFIG.binId;
const JSONBIN_READY = JSONBIN_CONFIG.binId !== 'SEM_VLOZ_BIN_ID' && JSONBIN_CONFIG.apiKey !== 'SEM_VLOZ_X_MASTER_KEY';
const POLL_INTERVAL_MS = 20000;
// =========================================================

let whoAmI = localStorage.getItem(STORAGE_PREFIX+'whoami') || null;
let appState = {}; // { matchId: { playerName: {status} } }
let syncTimer = null;

function getAllPlayers(){
  return PLAYERS.concat(appState.__customPlayers || []);
}

function populateWhoSelect(){
  const current = whoAmI;
  whoSel.innerHTML = '';
  const emptyOpt = document.createElement('option');
  emptyOpt.value = ""; emptyOpt.textContent = "— vyber jméno —";
  whoSel.appendChild(emptyOpt);
  getAllPlayers().forEach(p=>{
    const o = document.createElement('option');
    o.value = p.name; o.textContent = (p.num ? p.num+" · " : "") + p.name;
    whoSel.appendChild(o);
  });
  if(current) whoSel.value = current;
}

const whoSel = document.getElementById('whoami');
populateWhoSelect();
whoSel.addEventListener('change', ()=>{
  whoAmI = whoSel.value || null;
  if(whoAmI){ localStorage.setItem(STORAGE_PREFIX+'whoami', whoAmI); }
  else{ localStorage.removeItem(STORAGE_PREFIX+'whoami'); }
  renderAll();
});

const addPlayerBtn = document.getElementById('add-player-btn');
const addPlayerForm = document.getElementById('add-player-form');
const newPlayerNameInput = document.getElementById('new-player-name');
const newPlayerNumInput = document.getElementById('new-player-num');

addPlayerBtn.addEventListener('click', ()=>{
  const isOpen = addPlayerForm.style.display !== 'none';
  addPlayerForm.style.display = isOpen ? 'none' : 'flex';
  if(!isOpen) newPlayerNameInput.focus();
});

document.getElementById('new-player-cancel').addEventListener('click', ()=>{
  addPlayerForm.style.display = 'none';
  newPlayerNameInput.value = '';
  newPlayerNumInput.value = '';
});

document.getElementById('new-player-save').addEventListener('click', async ()=>{
  const name = newPlayerNameInput.value.trim();
  if(!name){
    alert('Zadej prosím jméno hráče.');
    return;
  }
  const numRaw = newPlayerNumInput.value.trim();
  const num = numRaw ? parseInt(numRaw, 10) : null;
  const exists = getAllPlayers().some(p => p.name.toLowerCase() === name.toLowerCase());
  if(exists){
    alert('Hráč se stejným jménem už v seznamu je.');
    return;
  }
  if(!appState.__customPlayers) appState.__customPlayers = [];
  appState.__customPlayers.push({name, num: (Number.isFinite(num) ? num : null)});
  populateWhoSelect();
  renderAll();
  addPlayerForm.style.display = 'none';
  newPlayerNameInput.value = '';
  newPlayerNumInput.value = '';
  await saveRemoteState();
});

function setSyncStatus(text, isError){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? '#C8102E' : 'var(--grey)';
}

async function fetchRemoteState(){
  if(!JSONBIN_READY){
    setSyncStatus('Sdílené úložiště není nastavené — data zůstávají jen v tomto prohlížeči.', true);
    appState = loadLocalFallback();
    return;
  }
  try{
    setSyncStatus('Synchronizuji…', false);
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_CONFIG.apiKey }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    appState = (data && data.record) ? data.record : {};
    localStorage.setItem(STORAGE_PREFIX+'cache', JSON.stringify(appState));
    setSyncStatus('Aktualizováno ' + new Date().toLocaleTimeString('cs-CZ', {hour:'2-digit', minute:'2-digit'}), false);
  }catch(e){
    console.error('Načtení dat selhalo', e);
    setSyncStatus('Nepodařilo se stáhnout aktuální data, zobrazuji poslední známý stav.', true);
    appState = loadLocalFallback();
  }
}

function loadLocalFallback(){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+'cache');
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    return {};
  }
}

async function saveRemoteState(){
  localStorage.setItem(STORAGE_PREFIX+'cache', JSON.stringify(appState));
  if(!JSONBIN_READY){
    setSyncStatus('Sdílené úložiště není nastavené — data zůstávají jen v tomto prohlížeči.', true);
    return;
  }
  try{
    setSyncStatus('Ukládám…', false);
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_CONFIG.apiKey
      },
      body: JSON.stringify(appState)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    setSyncStatus('Uloženo', false);
  }catch(e){
    console.error('Uložení se nezdařilo', e);
    setSyncStatus('Uložení se nezdařilo, zkus to prosím znovu.', true);
  }
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function countStatus(matchId){
  const data = appState[matchId] || {};
  let yes=0, no=0;
  Object.values(data).forEach(v=>{
    if(v.status==='yes') yes++;
    else if(v.status==='no') no++;
  });
  return {yes,no};
}

function statusLabel(status){
  if(status==='yes') return 'Přijde';
  if(status==='no') return 'Nepůjde';
  return 'Nevyplněno';
}

function renderMatchCard(match){
  const usHome = match.home === "FK Hlubočky";
  const c = countStatus(match.id);
  const myData = whoAmI ? ((appState[match.id] && appState[match.id][whoAmI]) || {}) : {};

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+match.id;

  const myStatusHTML = whoAmI ? `
    <div class="my-status-bar">
      <span class="my-status-label">Tvoje účast</span>
      <div class="status-group">
        <button class="status-btn yes ${myData.status==='yes' ? 'active':''}" data-status="yes">Přijdu</button>
        <button class="status-btn no ${myData.status==='no' ? 'active':''}" data-status="no">Nepůjdu</button>
      </div>
    </div>
    <div class="my-note-row">
      <input type="text" class="my-note-input" maxlength="60" placeholder="Krátká poznámka (např. přijdu později)…" value="${(myData.note||'').replace(/"/g,'&quot;')}">
    </div>
  ` : `
    <div class="my-status-bar my-status-prompt">Vyber si nahoře svoje jméno a označíš tady rovnou svoji účast.</div>
  `;

  card.innerHTML = `
    <div class="card-top" data-toggle="${match.id}">
      <div class="kolo-badge">${match.kolo}</div>
      <div class="match-info">
        <div class="teams">
          <span class="${usHome ? 'us' : ''}">${match.home}</span>
          <span class="vs">–</span>
          <span class="${!usHome ? 'us' : ''}">${match.away}</span>
        </div>
        <div class="meta-row">
          <span class="badge">${usHome ? 'Doma' : 'Venku'}</span>
          <span class="date-text">${match.day} ${match.date} · ${match.time}</span>
        </div>
        <div class="counts">
          <span><b style="color:var(--red)">${c.yes}</b> přijde</span>
          <span><b style="color:var(--ink)">${c.no}</b> nepřijde</span>
        </div>
      </div>
    </div>
    ${myStatusHTML}
    <div class="roster-toggle" data-toggle="${match.id}">
      <span>Zobrazit soupisku a účast celého týmu</span>
      <span class="chevron">⌄</span>
    </div>
    <div class="roster">
      <div class="roster-inner" id="roster-${match.id}"></div>
    </div>
  `;

  card.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      card.classList.toggle('open');
    });
  });

  const myBtns = card.querySelectorAll('.my-status-bar .status-btn');
  myBtns.forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const newStatus = btn.getAttribute('data-status');
      if(!appState[match.id]) appState[match.id] = {};
      const existing = appState[match.id][whoAmI] || {};
      const status = existing.status === newStatus ? null : newStatus;
      appState[match.id][whoAmI] = {status, note: existing.note || ''};
      const wasOpen = card.classList.contains('open');
      renderMatchCard(match);
      if(wasOpen){
        document.getElementById('card-'+match.id).classList.add('open');
      }
      await saveRemoteState();
    });
  });

  const myNoteInput = card.querySelector('.my-note-input');
  if(myNoteInput){
    myNoteInput.addEventListener('click', (e)=> e.stopPropagation());
    myNoteInput.addEventListener('change', async ()=>{
      if(!appState[match.id]) appState[match.id] = {};
      const existing = appState[match.id][whoAmI] || {};
      appState[match.id][whoAmI] = {status: existing.status || null, note: myNoteInput.value.trim()};
      const rosterRow = card.querySelector('.player-row .me')?.closest('.player-row');
      if(rosterRow){
        const noteRow = rosterRow.querySelector('.player-note-row');
        if(noteRow){
          noteRow.innerHTML = myNoteInput.value.trim() ? `<div class="player-note">${escapeHTML(myNoteInput.value.trim())}</div>` : '';
        }
      }
      await saveRemoteState();
    });
  }


  const rosterInner = card.querySelector('#roster-'+match.id);
  getAllPlayers().forEach(p=>{
    const data = (appState[match.id] && appState[match.id][p.name]) || {};
    const row = document.createElement('div');
    row.className = 'player-row';
    const isMe = whoAmI === p.name;
    const status = data.status || null;
    row.innerHTML = `
      <div class="player-row-main">
        <div class="player-name ${isMe ? 'me' : ''}">
          ${p.num ? `<span class="num">${p.num}</span>` : ''}
          ${p.name}
          ${isMe ? '<span class="me-tag">Ty</span>' : ''}
        </div>
        <span class="status-pill ${status || 'none'}">${statusLabel(status)}</span>
      </div>
      <div class="player-note-row">
        ${data.note ? `<div class="player-note">${escapeHTML(data.note)}</div>` : ''}
      </div>
    `;
    rosterInner.appendChild(row);
  });

  const existingCard = document.getElementById('card-'+match.id);
  if(existingCard){
    existingCard.replaceWith(card);
  } else {
    document.getElementById('matches').appendChild(card);
  }
}

function renderAll(){
  MATCHES.forEach(m => renderMatchCard(m));
}

async function init(){
  document.getElementById('matches').innerHTML = '<div style="text-align:center; padding:30px; color:var(--grey);">Načítám zápasy…</div>';
  await fetchRemoteState();
  populateWhoSelect();
  document.getElementById('matches').innerHTML = '';
  renderAll();
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(async ()=>{
    await fetchRemoteState();
    populateWhoSelect();
    renderAll();
  }, POLL_INTERVAL_MS);
}

document.getElementById('refresh-btn').addEventListener('click', async ()=>{
  await fetchRemoteState();
  populateWhoSelect();
  renderAll();
});

init();
</script>
</body>
</html>
