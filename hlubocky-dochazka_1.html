<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FK Hlubočky — Docházka na zápasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E;
    --red-dark:#8E0C22;
    --red-tint:#FBE6E9;
    --white:#FFFFFF;
    --ink:#1A1A1A;
    --grey:#6E6E6E;
    --line:#E7E7E7;
    --paper:#FAFAFA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--white);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:17px;
    min-height:100vh;
    padding-bottom:60px;
  }
  .display{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.01em; }

  header.banner{
    background: var(--red);
    padding:30px 20px 26px;
    border-bottom:6px solid var(--red-dark);
  }
  .banner-inner{ max-width:720px; margin:0 auto; }
  h1.display{
    color:var(--white);
    font-size:clamp(32px, 8vw, 48px);
    margin:0 0 4px;
    line-height:1;
    font-weight:700;
  }
  .banner-sub{ color: var(--white); font-size:16px; opacity:0.92; }

  .who-bar{ max-width:720px; margin:0 auto; padding:18px 20px 0; }
  .who-card{
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .who-label{ font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:14px; letter-spacing:0.04em; color:var(--ink); font-weight:600; }
  select#whoami{
    flex:1; min-width:200px;
    font-family:'Work Sans', sans-serif;
    font-size:17px; font-weight:600;
    padding:10px 12px;
    border-radius:8px;
    border:2px solid var(--line);
    background:var(--white);
    color:var(--ink);
  }
  select#whoami:focus{ outline:2px solid var(--red); outline-offset:1px; }
  .storage-note{ font-size:13px; color:var(--grey); text-align:center; margin-top:10px; }

  main{ max-width:720px; margin:22px auto 0; padding:0 20px; }

  .card{
    background:var(--white);
    border:2px solid var(--line);
    border-radius:14px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:16px;
    cursor:pointer;
    user-select:none;
    padding:16px;
  }
  .kolo-badge{
    width:56px; height:56px;
    border-radius:50%;
    background: var(--red);
    color:var(--white);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:24px;
  }
  .match-info{ flex:1; min-width:0; }
  .teams{ font-family:'Oswald',sans-serif; font-size:21px; font-weight:600; color:var(--ink); line-height:1.25; }
  .teams .vs{ color:var(--grey); font-weight:400; margin:0 6px; font-size:17px; }
  .teams .us{ color:var(--red); }
  .meta-row{ display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .badge{
    font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.04em;
    padding:3px 10px; border-radius:20px; font-weight:600;
    background: var(--red-tint); color:var(--red-dark);
  }
  .date-text{ font-size:15px; color:var(--grey); font-weight:500; }
  .counts{ display:flex; gap:14px; margin-top:8px; font-size:14px; color:var(--grey); flex-wrap:wrap; font-weight:500;}
  .chevron{ align-self:center; color:var(--grey); font-size:24px; transition: transform 0.2s ease; flex-shrink:0; }
  .card.open .chevron{ transform:rotate(180deg); }

  .roster{
    max-height:0;
    overflow:hidden;
    transition: max-height 0.28s ease;
    background: var(--paper);
    border-top:2px solid var(--line);
  }
  .card.open .roster{ max-height:2600px; }
  .roster-inner{ padding:14px 16px 18px; }
  .player-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .player-row:last-child{ border-bottom:none; }
  .player-name{ font-size:17px; font-weight:600; display:flex; align-items:center; gap:9px; min-width:160px; }
  .player-name .num{
    font-family:'Oswald',sans-serif; font-size:13px; color:var(--white);
    background:var(--ink); border-radius:5px; width:24px; height:24px;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .player-name.me{ color:var(--red-dark); }
  .player-name .me-tag{ font-size:11px; font-family:'Oswald',sans-serif; letter-spacing:0.04em; background:var(--red); color:var(--white); padding:2px 7px; border-radius:5px; text-transform:uppercase;}

  .status-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .status-btn{
    border:2px solid var(--line);
    background:var(--white);
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--ink);
    transition: all 0.15s ease;
  }
  .status-btn:hover{ border-color:var(--grey); }
  .status-btn:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
  .status-btn.active{ background:var(--red); border-color:var(--red); color:var(--white); }
  .status-btn.no.active{ background:var(--ink); border-color:var(--ink); }

  .legend{ display:flex; gap:16px; padding:14px 16px 2px; flex-wrap:wrap; font-size:13.5px; color:var(--grey); font-weight:500; }
  .legend b{ color:var(--ink); }

  .foot{ text-align:center; color:var(--grey); font-size:13px; margin-top:36px; }

  @media (max-width:420px){
    .kolo-badge{ width:46px; height:46px; font-size:20px; }
    .teams{ font-size:19px; }
    .status-btn{ padding:8px 11px; font-size:13px; }
  }
</style>
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <h1 class="display">FK Hlubočky</h1>
    <div class="banner-sub">Docházka na zápasy — sezóna 2026/2027</div>
  </div>
</header>

<div class="who-bar">
  <div class="who-card">
    <span class="who-label">Jsem</span>
    <select id="whoami"></select>
  </div>
  <div class="storage-note">Data se ukládají v tomto prohlížeči a nejsou sdílená mezi zařízeními.</div>
</div>

<main id="matches"></main>

<div class="foot">Vyber si svoje jméno nahoře a u každého zápasu klikni, zda dorazíš.</div>

<script>
const PLAYERS = [
  {name:"Jiří Henkl", num:null},
  {name:"Tomáš Vydomus", num:null},
  {name:"Patrik Axmann", num:20},
  {name:"Karel Krätschmer", num:1},
  {name:"Ondřej Scigel", num:14},
  {name:"Jan Scigel", num:16},
  {name:"Pavel Jahoda", num:2},
  {name:"Marek Goldscheid", num:3},
  {name:"Martin Auffahrt", num:11},
  {name:"Matěj Svozil", num:10},
  {name:"František Henkl", num:7},
  {name:"Michael Korec", num:15},
  {name:"Tomáš Režný", num:13},
  {name:"Jiří Grauer", num:5},
  {name:"Jan Táborský", num:8},
  {name:"Tomáš Hloušek", num:4},
  {name:"Ondřej Goldscheid (C)", num:9},
  {name:"Radek Škapa", num:6},
];

const MATCHES = [
  {id:"f90a174d-48a6-40ff-824a-eee992859754", kolo:3, home:"FK Kozlovice \u201eB\u201c", away:"FK Hlubočky", day:"Neděle", date:"16. 8. 2026", time:"16:30"},
  {id:"aa1fb1a3-df09-47ba-bcc5-42d131d1653e", kolo:4, home:"FK Hlubočky", away:"Sokol Čechovice", day:"Sobota", date:"22. 8. 2026", time:"16:30"},
  {id:"6eff8211-76dc-4fba-a22b-0c49d58722f2", kolo:5, home:"FC Beňov", away:"FK Hlubočky", day:"Neděle", date:"30. 8. 2026", time:"16:00"},
  {id:"4875cc99-b5f3-4cd4-b458-504bb7cbe34d", kolo:6, home:"FK Hlubočky", away:"Haná Prostějov", day:"Sobota", date:"5. 9. 2026", time:"16:00"},
  {id:"ab232848-71fe-4975-9142-cc9cbac00ab8", kolo:7, home:"Sokol Ústí", away:"FK Hlubočky", day:"Neděle", date:"13. 9. 2026", time:"10:00"},
  {id:"4d2ff375-564e-4c51-86a7-069d07d2c67e", kolo:8, home:"FK Hlubočky", away:"FC Želatovice \u201eB\u201c", day:"Sobota", date:"19. 9. 2026", time:"15:30"},
  {id:"4bad5b62-2e22-4ffc-adeb-cc5c0c1258f6", kolo:9, home:"Sokol Určice", away:"FK Hlubočky", day:"Neděle", date:"27. 9. 2026", time:"15:30"},
  {id:"3d84d43b-08b6-433e-8357-1f7448197d9c", kolo:10, home:"TJ Kožušany", away:"FK Hlubočky", day:"Neděle", date:"4. 10. 2026", time:"15:00"},
  {id:"51c50c20-0957-4a15-bbba-5c5b3461638e", kolo:11, home:"FK Hlubočky", away:"Sokol Mostkovice", day:"Sobota", date:"10. 10. 2026", time:"15:00"},
  {id:"bec6f7eb-c69d-4eba-a08a-872be403707f", kolo:12, home:"MILO Olomouc-Nové Sady B", away:"FK Hlubočky", day:"Neděle", date:"18. 10. 2026", time:"10:00"},
  {id:"5a2c4d76-182c-4421-b1dd-f47e52673726", kolo:13, home:"FK Hlubočky", away:"SOKOL Opatovice", day:"Sobota", date:"24. 10. 2026", time:"14:30"},
  {id:"6b7843ed-6c2e-42f6-be0e-02eb37cb545b", kolo:2, home:"FK Hlubočky", away:"SK Radslavice", day:"Sobota", date:"31. 10. 2026", time:"14:00"},
  {id:"fe87c722-1000-49a1-907b-b0cd57bc3617", kolo:1, home:"Sokol Velký Týnec", away:"FK Hlubočky", day:"Neděle", date:"8. 11. 2026", time:"14:00"},
];

const STORAGE_PREFIX = 'hlubocky-dochazka:';
let whoAmI = localStorage.getItem(STORAGE_PREFIX+'whoami') || null;
const responsesCache = {};

const whoSel = document.getElementById('whoami');
const empty = document.createElement('option');
empty.value = ""; empty.textContent = "— vyber jméno —";
whoSel.appendChild(empty);
PLAYERS.forEach(p=>{
  const o = document.createElement('option');
  o.value = p.name; o.textContent = (p.num ? p.num+" · " : "") + p.name;
  whoSel.appendChild(o);
});
if(whoAmI) whoSel.value = whoAmI;
whoSel.addEventListener('change', ()=>{
  whoAmI = whoSel.value || null;
  if(whoAmI){ localStorage.setItem(STORAGE_PREFIX+'whoami', whoAmI); }
  else{ localStorage.removeItem(STORAGE_PREFIX+'whoami'); }
  renderAll();
});

function loadMatch(matchId){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+matchId);
    responsesCache[matchId] = raw ? JSON.parse(raw) : {};
  }catch(e){
    responsesCache[matchId] = {};
  }
}

function saveMatch(matchId){
  try{
    localStorage.setItem(STORAGE_PREFIX+matchId, JSON.stringify(responsesCache[matchId]));
  }catch(e){
    console.error('Uložení se nezdařilo', e);
  }
}

function countStatus(matchId){
  const data = responsesCache[matchId] || {};
  let yes=0, no=0, sun=0;
  Object.values(data).forEach(v=>{
    if(v.status==='yes') yes++;
    else if(v.status==='no') no++;
    else if(v.status==='sun') sun++;
  });
  return {yes,no,sun};
}

function renderMatchCard(match){
  const usHome = match.home === "FK Hlubočky";
  const canProposeSunday = usHome && match.day === 'Sobota';
  const c = countStatus(match.id);

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+match.id;

  card.innerHTML = `
    <div class="card-top" data-toggle="${match.id}">
      <div class="kolo-badge">${match.kolo}</div>
      <div class="match-info">
        <div class="teams">
          <span class="${usHome ? 'us' : ''}">${match.home}</span>
          <span class="vs">–</span>
          <span class="${!usHome ? 'us' : ''}">${match.away}</span>
        </div>
        <div class="meta-row">
          <span class="badge">${usHome ? 'Doma' : 'Venku'}</span>
          <span class="date-text">${match.day} ${match.date} · ${match.time}</span>
        </div>
        <div class="counts">
          <span><b style="color:var(--red)">${c.yes}</b> přijde</span>
          <span><b style="color:var(--ink)">${c.no}</b> nepřijde</span>
          ${canProposeSunday ? `<span><b style="color:var(--red)">${c.sun}</b> preferuje neděli</span>` : ''}
        </div>
      </div>
      <div class="chevron">⌄</div>
    </div>
    <div class="roster">
      <div class="legend">
        <span><b>Přijdu</b> — dorazím na zápas</span>
        <span><b>Nepůjdu</b> — nedorazím</span>
        ${canProposeSunday ? `<span><b>Neděle</b> — vyhovovala by mi víc</span>` : ''}
      </div>
      <div class="roster-inner" id="roster-${match.id}"></div>
    </div>
  `;

  card.querySelector('.card-top').addEventListener('click', ()=>{
    card.classList.toggle('open');
  });

  const rosterInner = card.querySelector('#roster-'+match.id);
  PLAYERS.forEach(p=>{
    const data = (responsesCache[match.id] && responsesCache[match.id][p.name]) || {};
    const row = document.createElement('div');
    row.className = 'player-row';
    const isMe = whoAmI === p.name;
    row.innerHTML = `
      <div class="player-name ${isMe ? 'me' : ''}">
        ${p.num ? `<span class="num">${p.num}</span>` : ''}
        ${p.name}
        ${isMe ? '<span class="me-tag">Ty</span>' : ''}
      </div>
      <div class="status-group">
        <button class="status-btn yes ${data.status==='yes' ? 'active':''}" data-status="yes">Přijdu</button>
        <button class="status-btn no ${data.status==='no' ? 'active':''}" data-status="no">Nepůjdu</button>
        ${canProposeSunday ? `<button class="status-btn sun ${data.status==='sun' ? 'active':''}" data-status="sun">Neděle</button>` : ''}
      </div>
    `;
    row.querySelectorAll('.status-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!whoAmI){
          alert('Nejdřív si prosím vyber svoje jméno nahoře.');
          return;
        }
        if(p.name !== whoAmI){
          const proceed = confirm(`Označuješ stav za ${p.name}, i když jsi přihlášen jako ${whoAmI}. Pokračovat?`);
          if(!proceed) return;
        }
        const newStatus = btn.getAttribute('data-status');
        if(!responsesCache[match.id]) responsesCache[match.id] = {};
        const existing = responsesCache[match.id][p.name] || {};
        const status = existing.status === newStatus ? null : newStatus;
        responsesCache[match.id][p.name] = {status};
        saveMatch(match.id);
        const wasOpen = card.classList.contains('open');
        renderMatchCard(match);
        if(wasOpen){
          document.getElementById('card-'+match.id).classList.add('open');
        }
      });
    });
    rosterInner.appendChild(row);
  });

  const existingCard = document.getElementById('card-'+match.id);
  if(existingCard){
    existingCard.replaceWith(card);
  } else {
    document.getElementById('matches').appendChild(card);
  }
}

function renderAll(){
  MATCHES.forEach(m => renderMatchCard(m));
}

function init(){
  MATCHES.forEach(m => loadMatch(m.id));
  renderAll();
}

init();
</script>
</body>
</html>
